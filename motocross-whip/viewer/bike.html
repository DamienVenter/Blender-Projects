<title>Damien's CRF250R</title>
<style>
  /* One studio look on purpose (Honda's white sweep), so no dark variant: the bike alone, full screen. */
  :root {
    --sweep: #e8e9eb;      /* backdrop and floor */
    --ink: #2b2e33;        /* loading text */
    --track: #d3d5d9;      /* progress track */
    --fill: #c8102e;       /* progress fill, Honda red */
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--sweep); color: var(--ink); font-family: var(--font); overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }
  #load {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; justify-items: center;
    pointer-events: none; font-size: 13px; letter-spacing: 0.04em;
  }
  #bar { width: min(220px, 60vw); height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--fill); transition: width 0.2s; }
</style>

<div id="stage">
  <canvas id="c" aria-label="Damien's Honda CRF250R in 3D: drag to turn it, pinch or scroll to zoom"></canvas>
  <div id="load" role="status"><div id="bar"><i></i></div><span id="msg">Loading the bike</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("c");
  const loadEl = document.getElementById("load");
  const bar = document.querySelector("#bar i");
  const msg = document.getElementById("msg");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SWEEP = getComputedStyle(document.documentElement).getPropertyValue("--sweep").trim() || "#e8e9eb";

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SWEEP);
  scene.fog = new THREE.Fog(SWEEP, 9, 22);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb9bcc2, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(3, 6, 4);
  scene.add(key);

  // floor in the backdrop's colour, and a soft contact shadow under the bike (cheap: no shadow maps on a phone)
  const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64),
    new THREE.MeshBasicMaterial({ color: SWEEP, toneMapped: false }));   // same shade as the backdrop
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  function blob() {
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const g = c.getContext("2d");
    const r = g.createRadialGradient(128, 128, 8, 128, 128, 128);
    r.addColorStop(0, "rgba(0,0,0,0.42)");
    r.addColorStop(0.55, "rgba(0,0,0,0.16)");
    r.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = r;
    g.fillRect(0, 0, 256, 256);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false,
                                    toneMapped: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.y = 0.002;
    return m;
  }
  const shadow = blob();
  scene.add(shadow);

  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 80);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 0.6;
  controls.maxDistance = 14;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.autoRotate = !reduce;
  controls.autoRotateSpeed = 0.6;
  controls.addEventListener("start", () => { controls.autoRotate = false; });

  // front-left three-quarter, slightly above the bars: Blender (x forward, y left, z up) -> three (x, z, -y)
  const HERO = new THREE.Vector3(3.6, 1.3, -2.6).normalize();
  let radius = 1.2;
  function frame() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    const vf = THREE.MathUtils.degToRad(camera.fov);
    const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
    const d = radius / Math.sin(Math.min(vf, hf) / 2) * (camera.aspect < 1 ? 0.7 : 0.85);   // tighter on a phone
    camera.position.copy(controls.target).addScaledVector(HERO, d);
    camera.updateProjectionMatrix();
  }
  let framed = false;
  new ResizeObserver(() => {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
    if (!framed) frame();
  }).observe(stage);

  // the decoder runs as WebAssembly where the page may compile it, else as plain JavaScript
  let wasmOK = false;
  try { new WebAssembly.Module(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0])); wasmOK = true; } catch (e) { wasmOK = false; }
  const draco = new THREE.DRACOLoader();
  draco.setDecoderPath("draco/");
  draco.setDecoderConfig({ type: wasmOK ? "wasm" : "js" });
  const loader = new THREE.GLTFLoader();
  loader.setDRACOLoader(draco);

  const SIZE = 7.85e6;                                     // bytes of bike.json, for progress when no length is sent
  loader.load("bike.json", gltf => {
    const bike = gltf.scene;
    bike.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(m => { m.envMapIntensity = 0.75; }); });
    scene.add(bike);
    const box = new THREE.Box3().setFromObject(bike);
    const c = box.getCenter(new THREE.Vector3());
    const s = box.getSize(new THREE.Vector3());
    radius = 0.5 * Math.hypot(s.x, s.y, s.z);
    controls.target.set(c.x, c.y * 0.9, c.z);
    shadow.scale.set(s.x * 1.2, s.z * 1.15, 1);            // plane x = bike length, plane y = its width
    shadow.position.set(c.x, 0.002, c.z);
    frame();
    framed = true;
    loadEl.hidden = true;
  }, xhr => {
    const total = xhr.total || SIZE;
    bar.style.width = Math.min(100, 100 * xhr.loaded / total).toFixed(0) + "%";
  }, err => {
    msg.textContent = "The bike did not load. Reload the page to try again.";
    console.error(err);
  });

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
})();
</script>
